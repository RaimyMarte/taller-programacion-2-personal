<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo con degradado para que resalte en pestañas oscuras y claras -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="speedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>
  
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>

  <!-- Estelas de velocidad de fondo -->
  <path d="M4 18 H20 M2 32 H14 M5 46 H18" stroke="url(#speedGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>

  <!-- El Cubo en "Twist" (Giro rápido) -->
  <g transform="translate(6, 0)">
    <!-- Capa Superior Girada (Efecto Speed) -->
    <g transform="rotate(-15 32 32)">
      <rect x="22" y="14" width="10" height="10" rx="1.5" fill="#FFFFFF"/>
      <rect x="34" y="14" width="10" height="10" rx="1.5" fill="#3B82F6"/>
      <rect x="46" y="14" width="10" height="10" rx="1.5" fill="#EF4444"/>
    </g>

    <!-- Capa Central (Estable) -->
    <g>
      <rect x="20" y="27" width="10" height="10" rx="1.5" fill="#F59E0B"/>
      <rect x="32" y="27" width="10" height="10" rx="1.5" fill="#10B981"/>
      <rect x="44" y="27" width="10" height="10" rx="1.5" fill="#FFFFFF"/>
    </g>

    <!-- Capa Inferior Desplazada -->
    <g transform="translate(2, 0)">
      <rect x="16" y="40" width="10" height="10" rx="1.5" fill="#3B82F6"/>
      <rect x="28" y="40" width="10" height="10" rx="1.5" fill="#EF4444"/>
      <rect x="40" y="40" width="10" height="10" rx="1.5" fill="#F59E0B"/>
    </g>
  </g>

  <!-- El "Timer" / Flecha de rotación rápida que envuelve el cubo -->
  <path d="M 48 16 A 22 22 0 1 1 18 48" stroke="url(#speedGrad)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="1 4" opacity="0.7"/>
  <path d="M 52 24 A 22 22 0 0 0 52 20 L 46 22" stroke="#10B981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
